name: 💬 물어보기
description: vault 전체를 근거로 질문에 답합니다. 표현이 달라도 찾습니다.
title: "질문"
labels: ["ask"]
body:
  - type: markdown
    attributes:
      value: |
        사이트 검색(⌘K)은 **내가 쓴 단어를 그대로** 기억해야 찾힙니다.
        이건 다릅니다 — 개념을 여러 표기로 넓혀 검색하고, 걸린 노트를 전부 읽고, 인용과 함께 답합니다.
        답변은 `07-answers/` 에 노트로 남아 다음 검색 대상이 됩니다.

        즉답은 아닙니다. 보통 1~3분 걸립니다.

  - type: textarea
    id: question
    attributes:
      label: 질문
      description: 구체적일수록 좋습니다. "내가 X에 대해 뭐라고 적었지?" 형태도 잘 동작합니다.
      placeholder: |
        에이전트 비용 구조에 대해 내가 지금까지 뭘 모아뒀지? 결론이 뭔가?
    validations:
      required: true

  - type: input
    id: scope
    attributes:
      label: 범위 제한 (선택)
      description: 특정 폴더나 기간으로 좁히고 싶으면 적습니다.
      placeholder: 최근 2주 데일리 브리프만
