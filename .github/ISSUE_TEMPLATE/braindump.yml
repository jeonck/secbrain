name: 🧠 브레인덤프
description: 머릿속에 있는 걸 그대로 던지면 도메인별로 분류해 노트로 만듭니다.
title: "브레인덤프"
labels: ["braindump"]
body:
  - type: markdown
    attributes:
      value: |
        **정리하지 마세요.** 엉킨 채로 던지는 게 맞습니다. 프로젝트 아이디어, 거슬렸던 회의,
        읽을 링크 세 개가 한 문단에 섞여 있어도 됩니다 — 분류는 에이전트가 합니다.

  - type: textarea
    id: dump
    attributes:
      label: 덤프
      description: 문장이 안 되어도 괜찮습니다. 날짜가 있으면 적어 두면 태스크 기한으로 잡힙니다.
      placeholder: |
        어제 회의에서 온보딩 이탈률 얘기가 또 나왔는데 아무도 숫자를 안 봄...
        내달 초까지 퍼널 계측 붙여야 함
        그리고 이거 읽어야지 https://example.com/funnel-analytics
        에이전트 비용 구조 관련해서 워커 라우팅 패턴 정리해 두고 싶음
    validations:
      required: true

  - type: input
    id: hint
    attributes:
      label: 힌트 (선택)
      description: 분류에 참고할 맥락이 있으면 한 줄로. 없으면 비워 두세요.
      placeholder: 대부분 secbrain 프로젝트 관련입니다
