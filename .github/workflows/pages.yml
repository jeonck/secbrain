name: Build & Deploy Pages

on:
  push:
    branches: [main]
    paths-ignore:
      - "README.md"
      - "SETUP.md"
      - ".github/ISSUE_TEMPLATE/**"
  workflow_dispatch:

# 동시 배포 방지. 진행 중인 배포는 끝내고, 대기 중인 것만 교체.
concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build site from vault
        run: node scripts/build.mjs

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
